[package]
name = "chimera-desktop"
version.workspace = true
edition.workspace = true

[dependencies]
chimera-core = { path = "../chimera-core" }
chimera-hal = { path = "../chimera-hal" }
minifb = "0.28"
cpal = "0.15"
midir = { version = "0.10", optional = true }
embedded-graphics = "0.8"
embedded-graphics-core = "0.4"
# The TAPE importer (spec § 6), host only: WAV reading, the sinc resampler
# and the transwave mips' FFT.
hound = "3.5"
rubato = { version = "5.0", default-features = false }
rustfft = "6"

[features]
default = ["midi"]
midi = ["dep:midir"]
# The master tape stage back on the chain (ADR 0055).
master-tape = ["chimera-core/master-tape"]

[dev-dependencies]
chimera-core = { path = "../chimera-core", features = ["test-support"] }
chimera-hal = { path = "../chimera-hal", features = ["testkit"] }
