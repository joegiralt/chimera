[package]
name = "chimera-stm32"
version.workspace = true
edition.workspace = true

[dependencies]
chimera-core = { path = "../chimera-core" }
chimera-hal = { path = "../chimera-hal" }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
stm32h7xx-hal = { version = "0.16", features = ["stm32h750", "rt"] }
panic-halt = "1.0"
