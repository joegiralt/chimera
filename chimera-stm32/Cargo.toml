[package]
name = "chimera-stm32"
version.workspace = true
edition.workspace = true

[features]
default = ["midi-din", "midi-usb", "perf-probe", "usb-console", "card-put", "sweep-free", "midi-map", "push-encoders"]
midi-din = ["chimera-board/midi-din"]
# The console serviced from the OTG_FS interrupt, with its storm guard; on
# wherever MIDI DIN is.
midi-usb = ["usb-console", "chimera-board/midi-usb"]
perf-probe = ["chimera-board/perf-probe"]
# The bench on the unit, one area a build: all of it no longer fits FLASH
# beside the synth. `bench` is the shared rig, built with an area and
# `--no-default-features`: the shipping set less the console's `put`
# (`card-put`, ~7 KB), which no bench run needs. Bank 2 comes with every
# build (ADR 0194).
bench = ["perf-probe", "chimera-core/probe", "chimera-board/bench", "usb-console"]
# ALGO's patches, the FX bus, the kernel and FORMANT's rows; its ELF is the one
# `tools/loop_count.py` counts the kernel's loops on. Its bank 1 holds the
# rig; the reverb and VA's MOD path play from bank 2 (#654).
bench-algo = ["bench", "midi-din", "midi-usb", "chimera-core/span-count", "chimera-engine/demo-sounds", "chimera-engine/bench-warm"]
# A PC profile of ALGO's 6 OP and 1 OP rows and the idle bus, no other
# page and no `span-count`, so the kernel inlines as it ships (#793).
pc-sample = ["bench", "midi-din", "midi-usb", "chimera-engine/demo-sounds"]
# ROUTING: the matrix, filter types, taps and MODAL's rows.
bench-routing = ["bench", "midi-din", "midi-usb"]
# MEMORY: sizes, a rebuild, MODAL's note-ons, the project CRC.
bench-memory = ["bench", "midi-din", "midi-usb"]
# STRESS: NEW's Parts with every key down, and the runs' phases; ORBIT
# plays in them with `orbit`. The reverb plays from bank 2 (ADR 0174).
bench-stress = ["bench", "midi-din", "midi-usb"]
# ORBIT: its block's cost and phases (#654).
bench-orbit = ["bench", "midi-din", "midi-usb", "orbit"]
# TAPE COLD: each machine's cold-cache voice. It never plays MIDI; FLASH
# (#507). TAPE plays from bank 2 (#506): the run needs its .bk2 installed.
bench-tape = ["bench", "chimera-core/tape", "chimera-board/bench-tape"]
# The filter probes, linked though nothing calls them, for
# `tools/loop_count.py`'s static counts: the shipping build plus them, less
# the console's `put`, the MIDI map and PUSH ENCODERS as the bench's (bank
# 2's install filled FLASH; #507; the filters' loops are the same).
filter-probes = ["midi-din", "midi-usb", "perf-probe", "usb-console", "sweep-free", "chimera-core/filter-probe"]
# On-unit SD bring-up: prints the card probe and halts; no audio.
sd-probe = ["chimera-board/sd-probe"]
# The master tape stage back on the chain, with its bench row (ADR 0055).
master-tape = ["chimera-core/master-tape", "chimera-board/master-tape"]
# SYSTEM's PUSH ENCODERS (ADR 0140); the bench sets go without (FLASH).
push-encoders = ["chimera-board/push-encoders"]
# ORBIT, the ring sequencer: SEQ hold opens it, the audio block runs it.
orbit = ["chimera-core/orbit", "chimera-board/orbit"]
# The MIDI map: CC apply, learn and the MIDI MAP page (#247). Bench
# firmware leaves it out: FLASH (#507).
midi-map = ["chimera-board/midi-map"]
# The USB console (ADR 0068): CDC-ACM on the OTG FS port, polled from the UI
# loop, its interrupt never unmasked unless `midi-usb` moves it there.
usb-console = ["chimera-board/usb-console"]
# The console's `ls` and `put` (ADR 0092): files onto the card over USB;
# TAPE sources too, in checked chunks, sealed (ADR 0106). The owner took
# #360's risk for sources (2026-10-07): a cut mid-put can lose clusters.
# Bench builds answer `ls` and `put` "not in this build": FLASH is full.
card-put = ["usb-console", "chimera-board/card-put", "chimera-core/source-writer"]
# The boot's lost-cluster sweep frees what it finds (#360, ADR 0094). Off,
# it runs dry; on, it fails to build until the owner's go.
sweep-free = ["chimera-board/sweep-free"]
# The console's `fault dma <1|2>`: provokes a transfer error on a trailing
# DMA stream, to test its re-arm on the unit (#25). Never in a shipping build.
fault-inject = ["usb-console", "perf-probe", "midi-din", "midi-usb", "chimera-board/fault-inject", "chimera-core/fault-inject"]
# Hardware Gate 2's power-pull aid: the install holds 3 s at each phase
# (PULL NOW) and the console takes `bank2 erase`. `just firmware-gate` only:
# never in a release, flash or bench build (release-bin refuses its marker).
bank2-gate = ["usb-console", "chimera-board/bank2-gate"]

[dependencies]
# Bank 2 in every build, never a feature (ADR 0194): its section (header and
# door at 0x08100000, `build.rs`) and bank 1's seal of it (ADR 0137). The
# Justfile splits the ELF into .bin and .bk2. TAPE plays from bank 2, so the
# UI that loads its sources comes with it (chimera-core asserts the pair).
chimera-board = { path = "../chimera-board", features = ["bank2"] }
chimera-core = { path = "../chimera-core", default-features = false, features = ["bank2"] }
chimera-engine = { path = "../chimera-engine", features = ["bank2"] }
chimera-hal = { path = "../chimera-hal" }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
# set-vtor: Reset points VTOR at the linked __vector_table (FLASH ORIGIN in
# memory.x), whatever the bootloader left there.
cortex-m-rt = { version = "0.7.5", features = ["set-vtor"] }
# `stm32h750v` selects the rev V register definitions; that is safe on rev Y
# only while the HAL's ADC and `Delay` (rev-V-specific there) stay unused.
stm32h7xx-hal = { version = "0.16", features = ["stm32h750v", "rt"] }
embedded-graphics = "0.8"
embedded-graphics-core = "0.4"
libm = "0.2"

# no_std bin, own #[panic_handler]: the test harness pulls in std's, which
# clashes (E0152). Nothing here to unit test; chimera-core holds the logic.
[[bin]]
name = "chimera-stm32"
path = "src/main.rs"
test = false
