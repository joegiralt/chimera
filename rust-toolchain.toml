# The one pinned toolchain, here and in CI: the bank budgets
# (tools/bank1-budget.txt, tools/bank2-budget.txt) were measured with it,
# and another compiler moves the bytes. A bump re-measures them in the
# same change. Nightly for `core_float_math`, `optimize_attribute` and
# `-Z location-detail=none`.
[toolchain]
channel = "nightly-2026-08-28"
components = ["rustfmt", "clippy", "llvm-tools"]
targets = ["thumbv7em-none-eabihf"]
profile = "minimal"
