# The TAPE factory set, tapes-v1 (spec § 7, TAPE Task 19): where each
# source comes from, and the factory TAPE Sounds on them. `just
# factory-tapes` builds them into target/tapes-v1/; manifest-v1.json pins
# what it built. No audio here.
#
# [[source]]: name; origin render (a Chimera Sound: sound, notes, secs held,
# tail of release, less its first `from` s; modal picks INIT MODAL's model;
# morph = "sweep" sweeps MORPH over the hold), synth (the tool's own
# seeded synthesis) or cc0 (a recording in $CHIMERA_TAPES_SRC, secs of it
# from `from`; CC0 1.0 only);
# rate per § 7 (32k bright, 16k warm, 12k noise and field; TRON 8k); an
# optional root; transwave = a cycle in 48 kHz samples (16 frames).
#
# A six-Part project of the six largest Plain sources fits beside NEW
# (`six_parts_fit`): every Plain source but TRON and the kit is at most
# 18 KB (0.75 s at 16k, 0.375 s at 32k, 1 s at 12k).
#
# [[sound]]: name; source; model (its machine's defaults), PLAY with its mode
# (ONE, LOOP or PING; ONE holds); then TAPE params
# by label (START, END, POSITION, MOTION, TAPE, AGE, SIZE, XFADE, DRAG,
# TYPE, SLICE, WOW) as stored values; trim in dB on OUT LEVEL, so each sits
# at the factory median (`factory_sounds_sit_at_the_median`).

