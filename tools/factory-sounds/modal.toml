# The MODAL showcase Sounds (spec § 7): `[[sound]]` Sources as in va.toml.

[[sound]]
id = "S9100031"
name = "NYLON"
engine = "MODAL"
note = "PLUCK POSITION FOLLOWS NOTE"
demo = "poly"
plays = "long short"
home = "C3"
phrase = "lead"
approved = "round 3 7C6124FC"
MODAL.MODE = "STRING"
MODAL.BRIGHT = "0.3"  # 38
MODAL.DAMP = "0.7"  # 89
MODAL.POS = "0.3"  # 38
MODAL.COLOR = "0.6"  # 76
MODAL.BODY = "0.5"  # 64
MODAL.E.DPT = "0.3"  # 38
MODAL.E.MIX = "0.3"  # 38
mod.NOTE = "MODAL.POS +40"
mod.VEL = "MODAL.BRIGHT +50"
