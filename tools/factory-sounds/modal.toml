[[sound]]
id = "S9100033"
name = "CELLO SWELL"
engine = "MODAL"
note = "ENV 2 SWELLS THE BOWED TONE"
demo = "poly"
plays = "long texture"
home = "C3"
phrase = "lead"
approved = "round 3 2096D8FD"
MODAL.MODE = "BOWED"
MODAL.FORCE = "0.6"  # 76
MODAL.DAMP = "0.6"  # 76
MODAL.SPEED = "0.5"  # 64
MODAL.BRIGHT = "0.6"  # 76
ENV2.ATK = "0.5"  # 141 ms
ENV2.SUS = "0.7"  # 70%
ENV2.REL = "0.5"  # 187 ms
# FORCE is not a mod destination: ENV 2 swells BRIGHT and the cutoff instead.
mod.ENV2 = "MODAL.BRIGHT +70, FILTER.CUTOFF +40"
LFO1.RATE = "5"  # 5.00 Hz
mod.LFO1 = "PITCH.FINE +3"
LFO2.RATE = "0.3"  # 0.30 Hz
# SPEED is not a mod destination: LFO 2 moves the bow's position instead.
mod.LFO2 = "MODAL.POS +45"
mod.VEL = "MODAL.BRIGHT +30"
trim = "-6.6"

