# The MODAL showcase Sounds (spec § 7): `[[sound]]` Sources as in va.toml.

[[sound]]
id = "S9100031"
name = "NYLON"
engine = "MODAL"
note = "PLUCK POSITION FOLLOWS NOTE"
demo = "poly"
plays = "long short"
home = "C3"
phrase = "lead"
MODAL.MODE = "STRING"
MODAL.BRIGHT = "0.3"  # 38
MODAL.DAMP = "0.7"  # 89
MODAL.POS = "0.3"  # 38
MODAL.COLOR = "0.6"  # 76
MODAL.BODY = "0.5"  # 64
MODAL.E.DPT = "0.3"  # 38
MODAL.E.MIX = "0.3"  # 38
mod.NOTE = "MODAL.POS +40"
mod.VEL = "MODAL.BRIGHT +50"
LFO1.RATE = "0.3"  # 2
LFO1.SHAPE = "TRIANGLE"
mod.LFO1 = "MODAL.BRIGHT +25, MODAL.POS +20"
level = "by ear: set low so the lead phrase's plucks stay near 1 dB of limiting"
OUT.LEVEL = "1"  # 127
trim = "-3.0"

[[sound]]
id = "S9100032"
name = "GAMELAN"
engine = "MODAL"
note = "HARDER STRIKES RING BRIGHTER"
demo = "poly"
plays = "long short texture"
home = "C4"
phrase = "lead"
MODAL.MODE = "MODAL"
MODAL.STRUCTURE = "0.6"  # 76
MODAL.BRIGHT = "0.1"  # 13
MODAL.DAMP = "0.9"  # 114
MODAL.BURST = "0.1"  # 13
MODAL.EXCITE = "0.35"  # 44
FILTER.CUTOFF = "5000"  # 5.00 kHz
# Velocity also sets the strike: EXCITE is read at note-on (vel x EXCITE), not routable.
mod.VEL = "MODAL.BRIGHT +40"
LFO1.RATE = "0.2"  # 1
LFO1.SHAPE = "SINE"
mod.LFO1 = "MODAL.DAMP +30"
LFO2.RATE = "0.35"  # 2
LFO2.SHAPE = "SINE"
mod.LFO2 = "MODAL.BRIGHT +25, MODAL.STRUCTURE +8"
level = "by ear: set low so v127 texture strikes stay under 1 dB of limiting"
trim = "-3.8"

[[sound]]
id = "S9100033"
name = "CELLO SWELL"
engine = "MODAL"
note = "ENV 2 SWELLS THE BOWED TONE"
demo = "poly"
plays = "long texture"
home = "C3"
phrase = "lead"
MODAL.MODE = "BOWED"
MODAL.FORCE = "0.6"  # 76
MODAL.DAMP = "0.6"  # 76
MODAL.SPEED = "0.5"  # 64
MODAL.BRIGHT = "0.6"  # 76
ENV2.ATK = "0.5"  # 141 ms
ENV2.SUS = "0.7"  # 70%
ENV2.REL = "0.5"  # 187 ms
# FORCE is not a mod destination: ENV 2 swells BRIGHT and the cutoff instead.
mod.ENV2 = "MODAL.BRIGHT +70, FILTER.CUTOFF +40"
LFO1.RATE = "5"  # 32
mod.LFO1 = "PITCH.FINE +3"
LFO2.RATE = "0.3"  # 2
# SPEED is not a mod destination: LFO 2 moves the bow's position instead.
mod.LFO2 = "MODAL.POS +45"
mod.VEL = "MODAL.BRIGHT +30"
trim = "-6.6"

