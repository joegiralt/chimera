# Late-90s IDM set (with fm.toml and modal.toml): bit-crushed XOR grit.
# XOR is memoryless on sample words, so its folding is aliasing: NOTE pulls
# AMOUNT to 0 by C6/C7, and the cutoff stays off the LFOs (an LFO on
# CUTOFF read 38 dB at C7). The grit lives in the low and middle octaves.
[[sound]]
id = "S9100040"
name = "XOR GRIT"
