ENV1.REL = "0.45"  # 126 ms
mod.ENV1 = "OUT.VCA +127"
VA.MODE = "XOR"
VA.AMOUNT = "0.2"  # 25
VA.CRSE2 = "12"  # +12
FILTER.KIND = "2040"
FILTER.CUTOFF = "2200"  # 2.20 kHz
ENV2.ATK = "0"  # 2.0 ms
ENV2.DEC = "0.38"  # 72 ms
ENV2.SUS = "0"  # 0%
