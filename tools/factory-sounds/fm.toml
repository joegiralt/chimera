# Yelling lead: 3 -> 1, 2 a plain FM edge; 5 and 6 (F1, F2) into both
# carriers, so the lead talks. Velocity is the mouth: soft notes say "oo",
# hard ones "eh"; each pitch leans its own way (NOTE) and a slow LFO drifts
# it. No per-note envelope, babble, vibrato or delay (NEW's VOX has those).
# Every modulator at 2.00 into 1.00 and 3.00 carriers: odd sidebands, no
# DC (at 1.00 it read -36 dB). NOTE pulls every modulator to 0 by C7: at
# -90 C6 aliased (34.5 dB).
[[sound]]
