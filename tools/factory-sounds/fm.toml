# FM acid (S9100060, with va.toml's set): op 6, a sine, modulates op 1 on
# A2, one mono voice with a short glide. The index is the squelch's first
# half: ENV 2 snaps it down each note, an S&H LFO (8 Hz: a sixteenth at 120
# BPM, no LFO tempo sync) steps it and velocity pushes it; the LADDER then
# squelches the result as the other acid Sounds'. FM Parts have the filter,
# so the cutoff envelope is the same one.
