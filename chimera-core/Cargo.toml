[package]
name = "chimera-core"
version.workspace = true
edition.workspace = true

[dependencies]
chimera-engine = { path = "../chimera-engine" }
chimera-hal = { path = "../chimera-hal" }
chimera-theory = { path = "../chimera-theory" }
libm = "0.2"
embedded-graphics = "0.8"
embedded-graphics-core = "0.4"
# Bitmap fonts from U8g2 (crate MIT OR Apache-2.0; font licences in ADR 0016).
u8g2-fonts = "=0.8.0"

[features]
# Firmware builds only: the build stamps the git hash and dirty flag (#406).
stamp = []
# Firmware builds only: the wave tables rendered at boot (ADR 0122).
boot-waves = ["chimera-engine/boot-waves"]
default = ["orbit", "card-put", "tape"]
# The TAPE engine's DSP (ADR 0132): the firmware builds without it.
tape = ["chimera-engine/tape"]
# ORBIT, the ring sequencer: SEQ hold opens it. Off, SEQ hold does nothing.
orbit = []
# The console's `ls` and `put` (ADR 0092): project files onto the card.
card-put = ["chimera-engine/card-put"]
# The master tape stage on DAC pair 1 (ADR 0055: off the chain by default;
# its parameters and disk codes stay either way).
master-tape = ["chimera-engine/master-tape"]
# The by-value engine constructors (`AlgoEngine::new`, `ModalEngine::new`,
# `EngineSlot::new`), for tests only: firmware builds every engine in place.
test-support = ["chimera-engine/test-support"]
# `write_source`: sources written, verified and sealed on the card (the
# importer, the desktop, tests); with `card-put`, `put` takes them too
# (ADR 0106), as the firmware's `card-put` does.
source-writer = ["chimera-engine/source-writer"]
# Bench-only phase stamps inside ORBIT's block and the note handling.
probe = ["chimera-engine/probe"]
# The filter's static-cost probes (`dsp::filter::probe`) alone, for
# `tools/loop_count.py`: none of `probe`'s stamps.
filter-probe = ["chimera-engine/filter-probe"]
# `ring::smear_probe`: SMEAR's reads, recorded per thread. Tests only.
smear-probe = ["chimera-engine/smear-probe"]
# `rev::parts::clamp_counts`: the reverb's clamp hits, counted per thread.
# Tests only.
clamp-probe = ["chimera-engine/clamp-probe"]
# The console's `fault`: provokes a DMA transfer error to test the re-arm.
# Test builds only, never shipping.
fault-inject = []
# The console's bank-2 spike (`b2erase`, `b2prog`, `b2call`, `b2stat`):
# erases and programs bank-2 sector 0. Developer builds only, never shipping.
bank2-spike = []

[dev-dependencies]
# No default features: `--no-default-features` must reach the library too.
chimera-core = { path = ".", default-features = false, features = ["test-support", "source-writer", "smear-probe", "clamp-probe", "tape"] }
chimera-hal = { path = "../chimera-hal", features = ["testkit"] }



# The `SourceTable` model (`tests/loom_source_table.rs`): only under
# `RUSTFLAGS="--cfg loom"`, never in a firmware or desktop build. MIT.
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
