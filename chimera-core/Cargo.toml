[package]
name = "chimera-core"
version.workspace = true
edition.workspace = true

[features]
# The master tape stage on DAC pair 1 (ADR 0055: off the chain by default;
# its parameters and disk codes stay either way).
master-tape = []

[dependencies]
chimera-hal = { path = "../chimera-hal" }
libm = "0.2"
embedded-graphics = "0.8"
embedded-graphics-core = "0.4"
# Bitmap fonts from U8g2 (crate MIT OR Apache-2.0; font licences in ADR 0016).
u8g2-fonts = "=0.8.0"

[dev-dependencies]
chimera-hal = { path = "../chimera-hal", features = ["testkit"] }

[build-dependencies]
chimera-waves = { path = "../chimera-waves" }
