[package]
name = "chimera-core-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
chimera-core = { path = "..", features = ["test-support"] }
chimera-hal = { path = "../../chimera-hal" }

[[bin]]
name = "decode_sound"
path = "fuzz_targets/decode_sound.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_project"
path = "fuzz_targets/decode_project.rs"
test = false
doc = false
bench = false

[[bin]]
name = "peek_library"
path = "fuzz_targets/peek_library.rs"
test = false
doc = false
bench = false

[workspace]
