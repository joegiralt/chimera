[package]
name = "chimera-engine"
version.workspace = true
edition.workspace = true

# The synth's model and everything the audio runs (ADR 0108), in the fast
# profile: the DSP, the Instrument, ORBIT, the project and its storage.
# `chimera-core` re-exports it under the same paths and adds the UI and the
# console, built for size.
[dependencies]
chimera-hal = { path = "../chimera-hal" }
chimera-image = { path = "../chimera-image" }
chimera-theory = { path = "../chimera-theory" }
libm = "0.2"
chimera-waves = { path = "../chimera-waves" }

[features]
# SYSTEM's PUSH ENCODERS' fine turn (ADR 0140): `block::nudge_fine`.
push-encoders = []
# The wave tables rendered into RAM at boot (`waves::render_into`), not
# shipped in flash (ADR 0122). The firmware's; a host keeps the static.
boot-waves = []
# Bank 2's header placeholder and door table, in `.bank2` (ADR 0137): the
# link that ships the `.bk2` (and the proxy's host test). TAPE's deck is
# linked there, bank 1 keeping its proxy (`tape_engine::proxy`).
bank2 = ["tape"]
# The console's `ls` and `put` (ADR 0092): project files onto the card.
card-put = []
# The TAPE engine's DSP (ADR 0132): off in the shipping firmware, where no
# Part plays TAPE until its rework (#476); on for the desktop and tests.
tape = []
# The master tape stage on DAC pair 1 (ADR 0055: off the chain by default;
# its parameters and disk codes stay either way).
master-tape = []
# The by-value engine constructors (`AlgoEngine::new`, `ModalEngine::new`,
# `EngineSlot::new`), for tests only: firmware builds every engine in place.
test-support = []
# `Project::boxed` and `ArenaWriter::leaked`: NEW on a leaked heap arena,
# for host tools (the factory demo projects). Never a firmware build.
host-project = []
# `write_source`: sources written, verified and sealed on the card. Host
# only (the importer, the desktop, tests); no firmware build enables it
# until the lost-cluster sweep frees on the unit (#360).
source-writer = []
# Bench-only phase stamps inside ORBIT's block and the note handling.
probe = []
# The formant demo Sounds (`factory::demo_sound`): tests, and the
# bench-algo's CHOIR row.
demo-sounds = []
# The ALGO kernel's span and lane loops out of line, each its own symbol,
# for `tools/loop_count.py`: the bench-algo ELF only (flash).
span-count = []
# The filter's static-cost probes (`dsp::filter::probe`) alone, for
# `tools/loop_count.py`: none of `probe`'s stamps.
filter-probe = []
# `ring::smear_probe`: SMEAR's reads, recorded per thread. Tests only.
smear-probe = []
# `rev::parts::clamp_counts`: the reverb's clamp hits, counted per thread.
# Tests only.
clamp-probe = []

# The `SourceTable` model (`chimera-core/tests/loom_source_table.rs`): only
# under `RUSTFLAGS="--cfg loom"`, never in a firmware or desktop build. MIT.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[build-dependencies]
chimera-waves = { path = "../chimera-waves", features = ["emit"] }

[dev-dependencies]
chimera-engine = { path = ".", features = ["test-support", "source-writer", "smear-probe", "clamp-probe", "tape"] }
chimera-hal = { path = "../chimera-hal", features = ["testkit"] }
proptest = { version = "1", default-features = false, features = ["std"] }
