[workspace]
resolver = "2"
members = [
    "chimera-core",
    "chimera-hal",
    "chimera-stm32",
    "chimera-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Release profile: panic=abort needed for no_std targets
[profile.release]
panic = "abort"
opt-level = "s"
lto = true

[profile.dev]
panic = "abort"
