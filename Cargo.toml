[workspace]
resolver = "2"
members = [
    "chimera-core",
    "chimera-hal",
    "chimera-stm32",
    "chimera-desktop",
    "chimera-bootloader",
    "chimera-waves",
    "chimera-fat",
    "chimera-theory",
]
exclude = ["chimera-core/fuzz"]
default-members = [
    "chimera-core",
    "chimera-hal",
    "chimera-desktop",
    "chimera-waves",
    "chimera-fat",
    "chimera-theory",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Optimize all firmware dependencies in dev builds
[profile.dev.package.chimera-stm32]
opt-level = 2
[profile.dev.package.stm32h7xx-hal]
opt-level = 2
[profile.dev.package.stm32h7]
opt-level = 2
[profile.dev.package.cortex-m]
opt-level = 2
# With the USB console's crates, the debug bench builds no longer fit the
# 896 KB of flash unoptimised.
[profile.dev.package.synopsys-usb-otg]
opt-level = 2
[profile.dev.package.usb-device]
opt-level = 2
[profile.dev.package.usbd-serial]
opt-level = 2
[profile.dev.package.embedded-graphics]
opt-level = 2

# The DSP tests render seconds of audio in debug builds; opt-level 1 keeps
# overflow checks and debug assertions and changes no f32 result (no
# fast-math), so every golden still matches bit for bit.
[profile.dev.package.chimera-core]
opt-level = 1

# Release profile for firmware
[profile.release]
panic = "abort"
opt-level = 2
lto = "thin"
