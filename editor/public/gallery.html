<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chimera UI gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans+Condensed:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  body { margin: 0; background: #888; }
  .gallery .ghead { position: sticky; top: 0; z-index: 90; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 8px 16px; background: #121212; color: #fff; font: 600 13px/1.2 "IBM Plex Mono", monospace; }
  .gallery .ghead h1 { margin: 0; font: 700 15px/1 "IBM Plex Mono", monospace; letter-spacing: .18em; }
  .gallery .ghead .words { display: flex; gap: 4px; }
  .gallery .ghead button { background: transparent; color: #fff; border: 1px solid #fff; border-radius: 3px; padding: 6px 10px; font: inherit; cursor: pointer; }
  .gallery .ghead button.on, .gallery .ghead .jitter { background: #fff; color: #121212; }
  .gallery .gcols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .gallery .gcols > .ui.page { min-width: 0; }
  .gallery .gcols .ptop { position: static; }
</style>
</head>
<body>
<div id="app"></div>
<script src="gallery.js"></script>
<script src="theme.js"></script>
<script>
// JITTER: after each sample is drawn, measure every box and report the
// largest move against sample 0. A changed box count is a structural change.
(function () {
  var app = Elm.Gallery.init({ node: document.getElementById('app'), flags: ChimeraTheme.flags() });
  app.ports.storeTheme.subscribe(ChimeraTheme.store);
  var SEL = '.c,.c>.k,.c>.v,.mn,.hmn,.sec,.prow,.grp,.pnl,.screen,.att,.jack,.pst,.tw button,.sl button,.words button,.mx td';
  var base = null, shift = 0, worst = '-';
  function els() { return document.querySelectorAll('.gcols ' + SEL + ',.page ' + SEL); }
  function boxes() {
    return Array.prototype.map.call(els(), function (e) {
      var r = e.getBoundingClientRect();
      return [r.left, r.top + window.scrollY, r.width, r.height];
    });
  }
  app.ports.probe.subscribe(function (k) {
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      var now = boxes();
      if (k === 0) { base = now; shift = 0; worst = '-'; }
      else if (now.length !== base.length) { shift = -1; }
      else if (shift >= 0) now.forEach(function (b, i) { for (var j = 0; j < 4; j++) { var d = Math.abs(b[j] - base[i][j]); if (d > shift) { shift = d; var e = els()[i]; worst = e.className + ' [' + 'xywh'[j] + '] ' + ((e.closest('.sec') || e.querySelector('.sec')).querySelector('h2').textContent) + ' k=' + k; } } });
      document.title = 'JITTER k=' + k + ' boxes=' + now.length + ' shift=' + (shift < 0 ? 'structural' : shift.toFixed(2)) + ' worst=' + worst;
      app.ports.probed.send({ boxes: now.length, shift: shift });
    }); });
  });
  // ?probe=jitter runs it on load, for a headless check (the title carries the result).
  if (location.search.indexOf('probe=jitter') >= 0) window.addEventListener('load', function () {
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () { setTimeout(function () { document.querySelector('.jitter').click(); }, 300); });
  });
})();
</script>
</body>
</html>
