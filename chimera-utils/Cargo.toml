[package]
name = "chimera-utils"
version.workspace = true
edition.workspace = true
publish = false

# Host only (ADR 0098): nothing in the firmware depends on this crate.
[dependencies]
chimera-circuits = { path = "../chimera-circuits" }
chimera-core = { path = "../chimera-core" }
chimera-engine = { path = "../chimera-engine" }
chimera-hal = { path = "../chimera-hal", features = ["testkit"] }
chimera-image = { path = "../chimera-image" }
chimera-midi = { path = "../chimera-midi" }
hound = "3.5"
libm = "0.2"
object = { version = "0.36", default-features = false, features = ["read", "write", "std", "elf"] }
rayon = "1.11"
rustfft = "6.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
chimera-engine = { path = "../chimera-engine", features = ["source-writer"] }
chimera-hal = { path = "../chimera-hal", features = ["testkit"] }
