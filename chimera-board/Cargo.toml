[package]
name = "chimera-board"
version.workspace = true
edition.workspace = true

# The unit off the audio path (ADR 0108): its drivers, the boot and the UI
# loop. `chimera-stm32` is the binary, the audio interrupt and the bench;
# the UI's generics are instantiated here, in this crate's profile.
[features]
midi-din = []
perf-probe = []
bench = ["perf-probe"]
sd-probe = []
orbit = ["chimera-core/orbit"]
# MIDI learn (#247). Bench firmware leaves it out: FLASH (#507).
midi-learn = ["chimera-core/midi-learn"]
# The master tape's bench build: it drops the card bench, for AXI (ADR 0087).
master-tape = []
usb-console = [
    "stm32h7xx-hal/usb_hs",
    "dep:usb-device",
    "dep:usbd-serial",
    "dep:synopsys-usb-otg",
]
card-put = ["usb-console", "chimera-core/card-put"]
sweep-free = []
fault-inject = ["usb-console", "chimera-core/fault-inject"]

[dependencies]
chimera-core = { path = "../chimera-core", default-features = false, features = ["stamp", "boot-waves"] }
chimera-hal = { path = "../chimera-hal" }
chimera-fat = { path = "../chimera-fat" }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
# As `chimera-stm32`'s: the rev V register definitions.
stm32h7xx-hal = { version = "0.16", features = ["stm32h750v", "rt"] }
embedded-graphics = "0.8"
embedded-graphics-core = "0.4"
embedded-sdmmc = { version = "0.10", default-features = false }
embedded-hal = "1.0"
usb-device = { version = "0.3.2", optional = true }
usbd-serial = { version = "0.2.2", optional = true }
# The HAL's own OTG driver, for `usb::Otg2`, whose enable adds nothing to
# what `usb::preflight` checked (the HAL's `USB2` resets the block and sets
# USB33DEN inside the masked section).
synopsys-usb-otg = { version = "0.4.0", features = ["hs"], optional = true }

[lib]
test = false
