[package]
name = "chimera-board"
version.workspace = true
edition.workspace = true

# The unit off the audio path (ADR 0108): its drivers, the boot and the UI
# loop. `chimera-stm32` is the binary, the audio interrupt and the bench;
# the UI's generics are instantiated here, in this crate's profile.
[features]
midi-din = []
perf-probe = []
bench = ["perf-probe"]
sd-probe = []
orbit = ["chimera-core/orbit"]
# TAPE's bench build: it drops the card bench, for FLASH (#539). Not TAPE
# itself, which bank 2 brings to every firmware build (ADR 0194).
bench-tape = ["chimera-core/tape"]
# The MIDI map: CC apply, learn and the MIDI MAP page (#247). Bench
# firmware leaves it out: FLASH (#507).
midi-map = ["chimera-core/midi-map"]
# Each Part's tuning tables (ADR 0240): off in the bench builds, for AXI.
tuning = ["chimera-core/tuning"]
# SYSTEM's PUSH ENCODERS (ADR 0140): the 32-bit read.
push-encoders = ["chimera-core/push-encoders"]
# The master tape's bench build: it drops the card bench, for AXI (ADR 0087).
master-tape = []
usb-console = [
    "stm32h7xx-hal/usb_hs",
    "dep:usb-device",
    "dep:usbd-serial",
    "dep:synopsys-usb-otg",
]
card-put = ["usb-console", "chimera-core/card-put"]
# The console serviced from the OTG_FS interrupt, with its storm guard; USB
# MIDI joins it there, its class behind the board's door.
midi-usb = ["usb-console", "bank2"]
# USB audio (ADR 0248): the main out to the host, a UAC1 stream in USB
# MIDI's function. Off until the unit has run it.
usb-audio = ["midi-usb"]
sweep-free = []
fault-inject = ["usb-console", "chimera-core/fault-inject"]
# Bank 1's seal of the bank-2 image it was linked with (ADR 0137).
bank2 = ["chimera-core/bank2"]
# Bank 2's power-pull aid: `bank2 erase`, PULL NOW holds. Never shipping.
bank2-gate = ["bank2", "usb-console", "chimera-core/bank2-gate"]

[dependencies]
chimera-core = { path = "../chimera-core", default-features = false, features = ["stamp", "boot-waves"] }
chimera-hal = { path = "../chimera-hal" }
chimera-fat = { path = "../chimera-fat" }
chimera-image = { path = "../chimera-image" }
chimera-midi = { path = "../chimera-midi" }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
# As `chimera-stm32`'s: the rev V register definitions.
stm32h7xx-hal = { version = "0.16", features = ["stm32h750v", "rt"] }
embedded-graphics = "0.8"
embedded-graphics-core = "0.4"
embedded-sdmmc = { version = "0.10", default-features = false }
embedded-hal = "1.0"
# Its control buffer is 256 B through chimera-midi's (`usb_class`): the
# console's CDC with USB MIDI's function passes 128.
usb-device = { version = "0.3.2", optional = true }
usbd-serial = { version = "0.2.2", optional = true }
# The HAL's own OTG driver, for `usb::Otg2`, whose enable adds nothing to
# what `usb::preflight` checked (the HAL's `USB2` resets the block and sets
# USB33DEN inside the masked section). Pinned: the RXFLVL park
# (`usb::rx_head`, `rx_park`) rests on 0.4.0's `poll` popping one RX entry,
# serving ENUMDNE, WKUINT and USBSUSP before RX, and writing GINTMSK only in
# `enable` (ADR 0222); an upgrade rereads that first.
synopsys-usb-otg = { version = "=0.4.0", features = ["hs"], optional = true }

[lib]
test = false
